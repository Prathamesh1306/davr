name: 🐛 Bug Report
description: Report an issue or unexpected behavior in DAVR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you are testing against the latest version of DAVR.
        For security vulnerability reports, please follow [SECURITY.md](../../SECURITY.md) instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: DAVR Version
      description: Run `davr version` and paste the output here.
      placeholder: "davr 0.2.0 (commit abc1234)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and Rust version (e.g., macOS Sonoma 14.5 Apple Silicon / Ubuntu 24.04 x86_64, Rust 1.80.0)
      placeholder: "macOS 14.5 (aarch64), Rust 1.80.0"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Description of the Problem
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal repository setup to reproduce the issue.
      placeholder: |
        1. `davr init`
        2. `davr run -- bash -c "echo test > file.txt"`
        3. `davr rollback --dry-run`
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any command output with `--verbose` or diagnostic logs here.
      render: shell
